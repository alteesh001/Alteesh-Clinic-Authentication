openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Clinic authentication and onboarding
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Get clinic onboarding status
      description: Returns whether the clinic has an owner profile and whether first-admin onboarding is available.
      responses:
        "200":
          description: Current onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current clinic user
      description: Returns the signed-in user's local clinic profile and role.
      responses:
        "200":
          description: Current clinic user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProfile"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/bootstrap-admin:
    post:
      operationId: bootstrapAdmin
      tags: [auth]
      summary: Create the first clinic administrator
      description: Creates the first owner profile for the signed-in Clerk user. This endpoint is available only while the clinic has no owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapAdminInput"
      responses:
        "201":
          description: First administrator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProfile"
        "400":
          description: Invalid onboarding details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Clinic onboarding is already complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthStatus:
      type: object
      properties:
        configured:
          type: boolean
        clinicName:
          type: ["string", "null"]
      required:
        - configured
        - clinicName
    AuthProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [super_admin, admin, doctor, nurse, receptionist]
        clinicName:
          type: ["string", "null"]
        isOnboarded:
          type: boolean
      required:
        - id
        - email
        - fullName
        - role
        - clinicName
        - isOnboarded
    BootstrapAdminInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        clinicName:
          type: string
          minLength: 2
      required:
        - fullName
        - clinicName

